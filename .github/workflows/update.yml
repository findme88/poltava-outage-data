name: Update Poltava schedules

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "collector.py"
      - "poe_client.py"
      - "requirements.txt"
      - "test_*.py"
      - ".github/workflows/update.yml"

permissions:
  contents: read

concurrency:
  group: poltava-schedule-publisher
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install public collector dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test parser and JSON compatibility
        run: python -m unittest discover -v
      - name: Collect and validate official schedules
        run: python collector.py
      - name: Publish JSON changes or hourly verification heartbeat
        run: |
          if [ -z "$(git status --porcelain -- data/Poltavaoblenergo.json)" ]; then
            echo "No publication needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/Poltavaoblenergo.json
          git commit -m "Update verified Poltava outage data"
          git push origin HEAD:main
